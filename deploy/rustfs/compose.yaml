name: gravity-studio-storage

services:
  rustfs:
    image: docker.io/rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    container_name: gravity-studio-rustfs
    user: "10001:10001"
    command: ["rustfs", "/data"]
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: ""
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:9001,http://localhost:9001"
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    volumes:
      - rustfs-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rustfs-data:
    external: true
    name: gravity-studio-rustfs-data

secrets:
  rustfs_access_key:
    file: "${GRAVITY_RUSTFS_SECRETS_DIR:?Set an absolute private secrets directory}/access_key"
  rustfs_secret_key:
    file: "${GRAVITY_RUSTFS_SECRETS_DIR:?Set an absolute private secrets directory}/secret_key"
