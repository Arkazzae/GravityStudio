<!doctype html>
<html lang="en" data-gravity-offline="1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1113">
<title>Gravity Studio · Offline</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0f1113; color: #f5f5f5; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
  main { max-width: 390px; padding: 32px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 26px; letter-spacing: -.6px; margin: 24px 0 12px; }
  p { color: #aaa; line-height: 1.6; }
  button { margin-top: 12px; border: 0; border-radius: 12px; background: #d3f94c; color: #111; font: inherit; font-weight: 600; padding: 13px 24px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #f5f5f5; outline-offset: 4px; }
</style>
<main>
  <img src="/pwa/icon-192.png" alt="" width="72" height="72">
  <h1>Reconnect to your studio</h1>
  <p>Gravity Studio cannot reach your server. Reconnect to view your images and continue creating.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</html>
